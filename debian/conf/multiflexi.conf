# multiflexi default Apache configuration

Alias /multiflexi/api /usr/share/multiflexi-server/api
Alias /multiflexi /usr/share/multiflexi-web

<Directory /usr/share/multiflexi-web>
	Options FollowSymLinks
	DirectoryIndex index.php

	# The php_admin_value/php_flag directives below are only understood by
	# Apache when mod_php is loaded - on a php-fpm (proxy_fcgi) deployment,
	# which is the common case, this whole block is skipped and none of it
	# (including open_basedir) applies. open_basedir is instead hardened
	# portably for both SAPIs via the shipped src/.user.ini, installed
	# alongside the app. allow_url_fopen is PHP_INI_SYSTEM and has no
	# portable per-app equivalent - under php-fpm it needs to be set in the
	# pool config (php_admin_value[allow_url_fopen] = On) if desired.
	<IfModule mod_php7.c>
		AddType application/x-httpd-php .php
                <FilesMatch ".+\.php$">
                    SetHandler application/x-httpd-php
                </FilesMatch>

		php_flag magic_quotes_gpc Off
		php_flag track_vars On
		php_flag register_globals Off
		php_admin_flag allow_url_fopen On
#		php_admin_value upload_tmp_dir /var/lib/multiflexi/tmp
		php_admin_value open_basedir /usr/share/multiflexi-web/:/usr/lib/multiflexi-web/:/usr/share/multiflexi/images/:/etc/multiflexi/:/var/lib/multiflexi/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/var/tmp:/tmp:/usr/bin:/usr/sbin:/usr/local/bin:/usr/local/sbin:/var/lib/dbconfig-common/sqlite3/multiflexi/
	</IfModule>

# enable gzip compression
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/json
</IfModule>

</Directory>

<Directory /usr/share/multiflexi-server/api>
	Options FollowSymLinks
	DirectoryIndex index.php
	AllowOverride All
	Require all granted
</Directory>

