; PHP_INI_ALL/PHP_INI_PERDIR settings for this app that also apply when PHP
; is served via php-fpm (proxy_fcgi). The php_admin_value/php_flag lines in
; debian/conf/multiflexi.conf only take effect under mod_php - Apache never
; even registers those directive names without that module loaded, so on any
; php-fpm-only host (the common case today) open_basedir hardening was
; silently not applied at all. open_basedir is PHP_INI_ALL, so it can be set
; here instead, portably, regardless of SAPI.
open_basedir = "/usr/share/multiflexi-web/:/usr/lib/multiflexi-web/:/usr/share/multiflexi/images/:/etc/multiflexi/:/var/lib/multiflexi/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/var/tmp:/tmp:/usr/bin:/usr/sbin:/usr/local/bin:/usr/local/sbin:/var/lib/dbconfig-common/sqlite3/multiflexi/"

; allow_url_fopen is PHP_INI_SYSTEM and cannot be set here or via ini_set();
; under php-fpm it must be set per-pool (php_admin_value[allow_url_fopen] =
; On) rather than via the Apache-only php_admin_flag in multiflexi.conf.
